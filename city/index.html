<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>city</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
        :root {
            --bg: #f4ece1;
            --panel: #fbf7f1;
            --ink: #2d241c;
            --muted: #6f6457;
            --accent: #8a673a;
            --accent-soft: #d8c0a0;
            --visited: #6f8f4e;
            --border: rgba(73, 55, 34, 0.12);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg), #efe1c8);
            color: var(--ink);
        }

        .app-container {
            min-height: 100vh;
            padding-top: 1.2rem;
            padding-bottom: 1.5rem;
        }

        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card,
        .stat-card,
        #map-container {
            border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(58, 44, 23, 0.06);
        }

        .login-card {
            background: rgba(251, 247, 241, 0.95);
            border-radius: 1.2rem;
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: white;
            font-size: 1.2rem;
        }

        .page-shell {
            display: grid;
            gap: 0.9rem;
        }

        .stat-card {
            border: 0;
            border-radius: 1rem;
            background: rgba(251, 247, 241, 0.94);
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(138, 103, 58, 0.12);
            color: var(--accent);
            font-size: 0.95rem;
        }

        #map-container {
            position: relative;
            width: 100%;
            min-height: 500px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(244, 236, 225, 0.96));
            border-radius: 1.1rem;
            padding: 1rem;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.55rem;
            padding: 0.15rem 0.1rem 0.5rem;
        }

        .map-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--ink);
        }

        .map-subtitle {
            font-size: 0.8rem;
            color: var(--muted);
        }

        #turkey-map {
            width: 100%;
            height: auto;
            display: block;
        }

        #turkey-map path {
            fill: #e7dccf;
            stroke: #fbf7f1;
            stroke-width: .8;
            cursor: pointer;
            transition: fill .2s ease;
        }

        #turkey-map g.visited path {
            fill: var(--visited) !important;
        }

        .map-tooltip {
            position: absolute;
            z-index: 1000;
            display: none;
            max-width: 220px;
            background: rgba(43, 33, 22, 0.95);
            color: #f8efe2;
            padding: 10px 12px;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            pointer-events: none;
            box-shadow: 0 10px 24px rgba(43, 33, 22, 0.18);
        }

        @media (max-width: 768px) {
            #map-container {
                padding: 0.8rem;
                border-radius: 1rem;
            }

            .stat-card .fs-4 {
                font-size: 1.15rem !important;
            }
        }
    </style>
</head>

<body>
    <div id="login-screen" class="container py-5">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-7 col-lg-4">
                <div class="card login-card border-0">
                    <div class="card-body p-4 text-center">
                        <!-- <div class="brand-mark"></div> -->
                        <h1 class="h5 fw-bold mb-2"></h1>
                        <input id="password-input" type="password" class="form-control form-control-lg mb-3"
                            placeholder="password" autofocus>
                        <button id="login-button" class="btn btn-dark w-100">login</button>
                        <div id="login-error" class="text-danger text-center mt-3"> </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-content" class="container-xxl app-container" style="display:none">
        <div class="page-shell">
            <div class="row g-3">
                <div class="col-6 col-md-3">
                    <div class="card stat-card border-0 h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon"><i class="bi bi-globe2"></i></div>
                            <div>
                                <div class="text-muted small">total</div>
                                <div class="fs-4 fw-bold" id="total-province">81</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card border-0 h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon"><i class="bi bi-check2-circle"></i></div>
                            <div>
                                <div class="text-muted small">visited</div>
                                <div class="fs-4 fw-bold text-success" id="visited-count">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card border-0 h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon"><i class="bi bi-compass"></i></div>
                            <div>
                                <div class="text-muted small">remaining</div>
                                <div class="fs-4 fw-bold text-secondary" id="remaining-count">81</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card stat-card border-0 h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon"><i class="bi bi-speedometer2"></i></div>
                            <div>
                                <div class="text-muted small">completion</div>
                                <div class="fs-4 fw-bold text-primary" id="percentage">%0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-1">
                <div class="col-12">
                    <div id="map-container">
                        <div class="map-header">
                            <div class="map-title"></div>
                            <div class="map-subtitle"></div>
                        </div>
                        <div id="turkey-map"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="map-tooltip" class="map-tooltip"> </div>
    <script>
        const CONFIG = {
            password: "0",
            jsonUrl: "https://raw.githubusercontent.com/denizsuyu/city/refs/heads/main/city.json",
            useDummyData: false,
            dummyData: [
                {
                    "id": "06",
                    "name": "Ankara",
                    "visited": true,
                    "date": "",
                    "note": []
                }
            ]
        };
        const APP_STATE = {
            provinces: [],
            visitedCount: 0,
            mapLoaded: false
        };
        async function loadProvinceData() {
            if (CONFIG.useDummyData) {
                return CONFIG.dummyData;
            }
            try {
                const response = await fetch(CONFIG.jsonUrl);
                if (!response.ok) {
                    throw new Error("JSON data could not be loaded");
                }
                return await response.json();
            }
            catch (error) {
                console.error(error);
                return [];
            }
        }
        function prepareProvinceData(data) {
            APP_STATE.provinces = data.map(item => ({
                id: String(item.id).padStart(2, "0"),
                name: item.name || "",
                visited: Boolean(item.visited),
                date: item.date || "",
                note: item.note || []
            }));
            APP_STATE.visitedCount = APP_STATE.provinces.filter(item => item.visited).length;
        }
        function updateStatistics() {
            const visited = APP_STATE.visitedCount;
            document.getElementById("visited-count").textContent = visited;
            document.getElementById("remaining-count").textContent = 81 - visited;
            document.getElementById("percentage").textContent = "%" + Math.round((visited / 81) * 100);
        }
        async function loadTurkeyMap() {
            const svgText = await fetch("https://raw.githubusercontent.com/denizsuyu/city/refs/heads/main/img/turkey.svg").then(response => response.text());
            const container = document.getElementById("turkey-map");
            container.innerHTML = svgText;
            const svg = container.querySelector("svg");
            svg.id = "turkey-map-svg";
            svg.removeAttribute("width");
            svg.removeAttribute("height");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
        function getProvinceElements() {
            const svg = document.getElementById("turkey-map-svg");
            if (!svg) { return []; }
            return [...svg.querySelectorAll("g[data-city-code]")];
        }
        function findProvinceData(element) {
            const cityCode = element.getAttribute("data-city-code");
            return APP_STATE.provinces.find(province => province.id === cityCode);
        }
        function paintMap() {
            const elements = getProvinceElements();
            elements.forEach(element => {
                const province = findProvinceData(element);
                if (province && province.visited) {
                    element.classList.add("visited");
                }
            });
        }
        const tooltip = document.getElementById("map-tooltip");
        function showTooltip(event, province) {
            let html = `
                <div class="fw-bold mb-1">${province.name}</div>
            `;
            if (province.visited) {
                html += `
                    <div class="text-success-emphasis">
                        <i class="bi bi-check-circle-fill text-white"></i>
                    </div>
                `;
                if (province.date) {
                    html += `
                        <div class="mt-2">
                            <small>
                                <i class="bi bi-calendar-event"></i> ${province.date}
                            </small>
                        </div>
                    `;
                }
                if (province.note.length > 0) {
                    html += `
                        <div class="mt-2">
                            <small>${province.note.join(" <br> ")}</small>
                        </div>
                    `;
                }
            }
            else {
                html += `
                <div class="text-secondary">
                    <i class="bi bi-x-circle-fill"></i>
                </div>
                `;
            }
            tooltip.innerHTML = html;
            tooltip.style.display = "block";
            moveTooltip(event);
        }
        function moveTooltip(event) {
            const container = document.getElementById("map-container");
            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left + 12;
            const y = event.clientY - rect.top + 12;
            const maxX = rect.width - 220;
            const maxY = rect.height - 80;
            tooltip.style.left = Math.max(8, Math.min(x, maxX)) + "px";
            tooltip.style.top = Math.max(8, Math.min(y, maxY)) + "px";
        }
        function hideTooltip() {
            tooltip.style.display = "none";
        }
        function bindMapEvents() {
            const elements = getProvinceElements();
            elements.forEach(element => {
                const province = findProvinceData(element);
                const data = province || {
                    name: element.getAttribute("data-city-name"),
                    visited: false,
                    date: "",
                    note: []
                };
                element.addEventListener("mouseenter", event => {
                    showTooltip(event, data);
                });
                element.addEventListener("mousemove", moveTooltip);
                element.addEventListener("mouseleave", hideTooltip);
            });
        }
        async function init() {
            const data = await loadProvinceData();
            prepareProvinceData(data);
            updateStatistics();
            await loadTurkeyMap();
            paintMap();
            bindMapEvents();
        }
        function checkLogin() {
            const input = document.getElementById("password-input");
            const error = document.getElementById("login-error");
            if (input.value === CONFIG.password) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-content").style.display = "block";
                init();
            }
            else {
                error.textContent = "incorrect password";
                input.value = "";
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("login-button").addEventListener("click", checkLogin);
            document.getElementById("password-input").addEventListener("keypress", event => {
                if (event.key === "Enter") {
                    checkLogin();
                }
            });
            document.getElementById("password-input").focus();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
